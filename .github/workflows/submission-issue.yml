# Submissions made as issues (the "Submission" issue form, opened by the form
# on the site), so contributors need no fork or pull request.
#
#   summary: when a submission issue is opened or edited, posts the summary
#            for maintainers (scripts/issue-submission.ts summary).
#   accept:  when someone comments "/accept", checks the approval rules
#            (src/lib/review.ts, issueApprovalDecision). If they are met, it
#            commits the submission to main with the deploy key and closes the
#            issue. That push starts "Sign and deploy", which checks the issue
#            again before signing.
#
# Both jobs run only code from main. The issue's text is untrusted: it is read
# from the event or the API as data, never put into a shell command.
name: Submission issue

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  summary:
    if: github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    concurrency:
      group: submission-issue-summary-${{ github.event.issue.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Post the summary
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/issue-submission.ts summary

  accept:
    if: >-
      github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'submission') &&
      startsWith(github.event.comment.body, '/accept')
    runs-on: ubuntu-latest
    # One acceptance at a time, so two never race to push.
    concurrency:
      group: submission-issue-accept
      cancel-in-progress: false
    # For the deploy key (SIGNING_DEPLOY_KEY), which may push to main.
    environment: signing
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          ssh-key: ${{ secrets.SIGNING_DEPLOY_KEY }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # No install scripts in the job that holds the deploy key.
      - run: npm ci --ignore-scripts

      - id: accept
        name: Check the approvals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/issue-submission.ts accept

      - name: Commit the accepted submission
        if: steps.accept.outputs.slug
        env:
          SLUG: ${{ steps.accept.outputs.slug }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "submissions/$SLUG.json" data/issue-submissions.json
          git commit -m "Accept submission $SLUG (#$ISSUE)"
          if ! git pull --rebase origin main || ! git push origin HEAD:main; then
            echo "::error::Could not push the accepted submission. Comment /accept again to retry."
            exit 1
          fi

      - name: Close the issue
        if: steps.accept.outputs.slug
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed --comment "$(cat "$RUNNER_TEMP/accepted.md")"
