# Runs on every pull request. For a submission PR, the JSON is validated and a
# readable preview is written to the job summary for the maintainers who
# review it. This check helps reviewers; it is not a security boundary (a PR
# can edit this file). Branch protection and CODEOWNERS are.
name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate changed submissions
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          # NUL-separated, so unusual file names cannot split or hide.
          git diff -z --name-only --diff-filter=AMR "$BASE...HEAD" -- submissions/ > "$RUNNER_TEMP/changed"
          if [ -s "$RUNNER_TEMP/changed" ]; then
            xargs -0 npm run -s validate -- --changed < "$RUNNER_TEMP/changed"
          else
            npm run -s validate
          fi

      - name: Signed reports are not edited by hand
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          touched=$(git diff --name-only "$BASE...HEAD" -- public/credentials public/specimen.json data/report-numbers.json config/keys.json)
          if [ -n "$touched" ]; then
            echo "::warning::This pull request changes signed reports, report numbers or keys. Only the signing workflow (or a maintainer rotating keys) should do this: $touched"
          fi

      - run: npm test
      - run: npm run build
